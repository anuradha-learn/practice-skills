
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Practice & Skill Checks — Anuradha Agarwal</title>
<meta property="og:title" content="Practice & Skill Checks — Anuradha Agarwal">
<meta property="og:description" content="Interactive quizzes and skill checks across all courses — start with Playwright + TypeScript.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F8FA; --panel:#FFFFFF; --panel-2:#F7F8FA; --border:#E2E6ED;
    --text:#17203A; --text-dim:#5B6478; --text-faint:#8B93A7;
    --orange:#E8792A; --orange-text:#C85F14; --orange-tint:#FDF1E7;
    --mono:'IBM Plex Mono', monospace; --sans:'Inter', -apple-system, sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--text); font-family:var(--sans); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; line-height:1.5;}
  .window{width:100%; max-width:640px; background:var(--panel); border:1px solid var(--border); border-radius:10px; overflow:hidden; box-shadow:0 8px 30px rgba(23,32,58,0.08);}
  .titlebar{background:var(--panel-2); border-bottom:1px solid var(--border); padding:12px 16px; display:flex; align-items:center; gap:10px;}
  .dot{width:11px; height:11px; border-radius:50%;}
  .dot.r{background:#F0625A;} .dot.a{background:#F5B942;} .dot.g{background:#4ADE80;}
  .filename{font-family:var(--mono); font-size:12.5px; color:var(--text-dim); margin-left:8px;}
  .filename b{color:var(--text); font-weight:500;}
  .content{padding:32px 28px 28px 28px;}
  .eyebrow{font-family:var(--mono); font-size:12px; letter-spacing:0.06em; color:var(--orange-text); text-transform:uppercase; margin-bottom:14px; display:flex; align-items:center; gap:8px;}
  .eyebrow::before{content:"▶"; font-size:10px;}
  h1{font-size:24px; font-weight:700; letter-spacing:-0.01em; margin-bottom:10px; color:var(--text);}
  .intro-p{color:var(--text-dim); font-size:14.5px; margin-bottom:28px; max-width:48ch;}
  .track-list{display:flex; flex-direction:column; gap:12px;}
  .track-card{display:flex; align-items:center; gap:16px; text-decoration:none; background:var(--panel); border:1px solid var(--border); border-left:3px solid var(--orange); border-radius:10px; padding:20px 22px; transition:transform .15s ease, box-shadow .15s ease;}
  .track-card:hover{transform:translateX(2px); box-shadow:0 4px 14px rgba(232,121,42,0.18);}
  .track-icon{width:48px; height:48px; border-radius:10px; background:var(--orange); display:flex; align-items:center; justify-content:center; font-size:22px; flex-shrink:0;}
  .track-title{font-size:16px; font-weight:600; margin-bottom:2px; color:var(--text);}
  .track-desc{font-size:13px; color:var(--text-dim);}
  .track-arrow{margin-left:auto; color:var(--orange); font-size:18px;}
  .track-card.soon{border-left-color:var(--border); background:var(--panel-2); pointer-events:none; opacity:0.7;}
  .track-card.soon .track-icon{background:var(--border);}
  .track-card.soon:hover{transform:none; box-shadow:none;}
</style>
</head>
<body>
<div class="window">
  <div class="titlebar"><div class="dot r"></div><div class="dot a"></div><div class="dot g"></div><span class="filename">practice-skills<b>/</b></span><a href="https://www.anuradhaagarwal.com" target="_top" style="margin-left:auto; background:var(--blue); color:#08101C; font-family:var(--mono); font-size:11px; font-weight:600; padding:5px 12px; border-radius:6px; text-decoration:none;">My Website ↗</a></div>
  <div class="content">
    <div class="eyebrow">quiz home</div>
    <h1>Practice &amp; skill checks</h1>
    <p class="intro-p">Pick a track to see its starting-point check and section-by-section quizzes.</p>
    <div class="track-list">
      <a class="track-card" href="playwright-ts/hub.html">
        <div class="track-icon">🎭</div>
        <div><div class="track-title">Playwright + TypeScript</div><div class="track-desc">Starting-point check + 14 section quizzes</div></div>
        <div class="track-arrow">→</div>
      </a>
      <div class="track-card soon">
        <div class="track-icon">➕</div>
        <div><div class="track-title" style="color:var(--text-dim);">More tracks coming</div><div class="track-desc">Future courses will land here</div></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
